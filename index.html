function resize(){
  const dpr=window.devicePixelRatio||1;
  cv.width=Math.floor(innerWidth*dpr); cv.height=Math.floor(innerHeight*dpr);
  cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
  SC=Math.min(cv.width/W,cv.height/H);
  OX=Math.floor((cv.width-W*SC)/2); OY=Math.floor((cv.height-H*SC)/2);
}
addEventListener('resize',resize); resize();

// ---------- utilidades ----------
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function hash(x,y,s=0){let h=(x*374761393+y*668265263+s*982451653)|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();}

const keys={},pressed={};
const BLOCK=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab'];
addEventListener('keydown',e=>{if(!keys[e.code])pressed[e.code]=true;keys[e.code]=true;if(BLOCK.includes(e.code))e.preventDefault();audioInit();});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
const jp=(...c)=>c.some(k=>pressed[k]);

const TB=[
  {code:'ArrowLeft',x:34,y:234,r:17,l:'◀'},{code:'ArrowRight',x:80,y:234,r:17,l:'▶'},
  {code:'ArrowUp',x:57,y:202,r:13,l:'▲'},{code:'ArrowDown',x:57,y:262,r:10,l:'▼'},
  {code:'KeyZ',x:446,y:232,r:19,l:'Pular'},{code:'KeyX',x:402,y:248,r:16,l:'Atacar'},
  {code:'KeyC',x:404,y:206,r:13,l:'Avanço',need:'dash'},{code:'KeyV',x:446,y:190,r:13,l:'Luz',need:'burst'},
  {code:'KeyM',x:W/2-14,y:12,r:9,l:'M'},{code:'Escape',x:W/2+14,y:12,r:9,l:'II'},

const tbVisible=b=>!b.need||(G&&G.ab[b.need]);
function tPos(t){const r=cv.getBoundingClientRect(),k=cv.width/r.width;return{x:((t.clientX-r.left)*k-OX)/SC,y:((t.clientY-r.top)*k-OY)/SC};}
function onTouch(e){
  e.preventDefault();audioInit();touchMode=true;
  const on=new Set();
  if(mode==='play')for(const t of e.touches){const p=tPos(t);for(const b of TB)if(tbVisible(b)&&Math.hypot(p.x-b.x,p.y-b.y)<b.r+7)on.add(b.code);}
  for(const b of TB){const v=on.has(b.code);if(v&&!keys[b.code])pressed[b.code]=true;keys[b.code]=v;}
  if(mode!=='play'&&e.type==='touchstart')pressed.Enter=true;
}
for(const ev of ['touchstart','touchmove','touchend','touchcancel'])cv.addEventListener(ev,onTouch,{passive:false});

let AC=null,master=null,musicOn=true,mStep=0,mNext=0;
function audioInit(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.5;master.connect(AC.destination);}catch(e){AC=null;}}
function toneAt(f,dur,type,vol,t,slide=0){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);}
function tone(f,dur,type='square',vol=0.1,slide=0,delay=0){if(AC)toneAt(f,dur,type,vol,AC.currentTime+delay,slide);}
function noise(dur,vol=0.15,freq=1200){if(!AC)return;const n=Math.floor(AC.sampleRate*dur),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;const g=AC.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(master);s.start();}

  hurt:()=>tone(240,0.3,'sawtooth',0.09,-170), pick:()=>{tone(880,0.08,'triangle',0.08);tone(1320,0.14,'triangle',0.08,0,0.06);},
  dash:()=>noise(0.16,0.1,700), burst:()=>{tone(180,0.6,'sine',0.2,700);noise(0.45,0.12,500);},
  power:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,0.35,'triangle',0.08,0,i*0.09)),
  save:()=>[392,523,659,784].forEach((f,i)=>tone(f,0.5,'sine',0.09,0,i*0.12)),
  boss:()=>{tone(70,1.2,'sawtooth',0.12,-20);tone(105,1.2,'sawtooth',0.06,-30);}, orb:()=>tone(620,0.15,'sine',0.05,-300),
  land:()=>noise(0.05,0.05,500), die:()=>[400,300,200,120].forEach((f,i)=>tone(f,0.3,'triangle',0.09,0,i*0.12)),
};
const CHORDS=[[146.83,174.61,220],[116.54,146.83,174.61],[174.61,220,261.63],[130.81,164.81,196]];
const ARP=[0,1,2,1,2,0,1,2];
function musicTick(){
  if(!AC||!musicOn)return;
  if(mNext<AC.currentTime)mNext=AC.currentTime+0.05;
  const fight=boss&&boss.active&&boss.state!=='dying'&&boss.state!=='gone';
  const beat=fight?0.15:0.3;
  while(mNext<AC.currentTime+0.3){
    const bar=Math.floor(mStep/8)%4,st=mStep%8,ch=CHORDS[bar];
    toneAt(ch[ARP[st]]*(fight?1:2),beat*1.7,fight?'square':'triangle',fight?0.016:0.022,mNext);
    if(st===0)toneAt(ch[0]/2,beat*8,'sine',0.05,mNext);
    if(fight&&st%2===0)toneAt(ch[0]/2,beat*0.9,'triangle',0.04,mNext);
    if(!fight&&st===3&&bar%2===0)toneAt(ch[2]*4,beat*3,'sine',0.012,mNext);
    mNext+=beat;mStep++;
  }
}

// ---------- sprites ----------
function spr(rows,pal){const w=Math.max(...rows.map(r=>r.length)),c=mk(w,rows.length),x=c.getContext('2d');rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const col=pal[r[i]];if(col){x.fillStyle=col;x.fillRect(i,j,1,1);}}});return c;}
function flipC(c){const f=mk(c.width,c.height),x=f.getContext('2d');x.translate(c.width,0);x.scale(-1,1);x.drawImage(c,0,0);return f;}
function whiteC(c){const f=mk(c.width,c.height),x=f.getContext('2d');x.drawImage(c,0,0);x.globalCompositeOperation='source-in';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);return f;}
const PAL_P={w:'#f3f4ff',h:'#a9afe0',s:'#f7d8c2',e:'#2a3170',r:'#e23a52',R:'#a01f3e',c:'#272b5a',C:'#3c4488',b:'#17162d',g:'#e8c35a'};

function glowSpr(col){if(glowCache[col])return glowCache[col];const c=mk(64,64),x=c.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,`rgba(${col},0.85)`);g.addColorStop(0.35,`rgba(${col},0.3)`);g.addColorStop(1,`rgba(${col},0)`);x.fillStyle=g;x.fillRect(0,0,64,64);return glowCache[col]=c;}
function drawGlow(x,y,r,col,a=1){ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=clamp(a,0,1);ctx.drawImage(glowSpr(col),x-r,y-r,r*2,r*2);ctx.restore();}
const VIGN=(()=>{const c=mk(W,H),x=c.getContext('2d'),g=x.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.95);g.addColorStop(0,'rgba(6,4,22,0)');g.addColorStop(1,'rgba(6,4,22,0.6)');x.fillStyle=g;x.fillRect(0,0,W,H);return c;})();
const CLOUD_SPR=[0,1,2].map(i=>{const R=mulberry(77+i),c=mk(90,40),x=c.getContext('2d');const pts=[];for(let k=0;k<7;k++)pts.push([15+R()*60,20+R()*8,7+R()*9]);x.fillStyle='rgba(150,140,215,0.9)';for(const p of pts)circ(x,p[0],p[1]+3,p[2]);x.fillStyle='rgba(220,214,250,0.95)';for(const p of pts)circ(x,p[0],p[1],p[2]);return c;});

function drawIcon(c,type,x,y,s,col){
  c.save();c.translate(x,y);c.scale(s,s);c.lineCap='round';c.lineJoin='round';c.strokeStyle=col;c.fillStyle=col;c.lineWidth=1.5;
  if(type==='dash'){c.beginPath();c.moveTo(-4,0);c.lineTo(6,0);c.moveTo(2,-4);c.lineTo(6,0);c.lineTo(2,4);c.stroke();c.globalAlpha*=0.6;c.beginPath();c.moveTo(-7,-3);c.lineTo(-2,-3);c.moveTo(-7,3);c.lineTo(-2,3);c.stroke();}
  else if(type==='double'){c.beginPath();c.moveTo(-5,5);c.quadraticCurveTo(-4,-5,7,-6);c.quadraticCurveTo(4,-3,5,-1);c.quadraticCurveTo(2,0,3,1.5);c.quadraticCurveTo(0,2.5,0,4);c.closePath();c.fill();}
  else if(type==='burst'){for(let i=0;i<8;i++){const a=i*Math.PI/4,r2=i%2?5:7.5;c.beginPath();c.moveTo(Math.cos(a)*3.2,Math.sin(a)*3.2);c.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);c.stroke();}c.beginPath();c.arc(0,0,2.4,0,7);c.fill();}
  else if(type==='heart'){c.beginPath();c.moveTo(0,5);c.bezierCurveTo(-8,-1,-4,-7,0,-3);c.bezierCurveTo(4,-7,8,-1,0,5);c.fill();}

}

function drawMoon(x,cx,cy,r){const g=x.createRadialGradient(cx,cy,r*0.8,cx,cy,r*3);g.addColorStop(0,'rgba(220,215,255,0.35)');g.addColorStop(1,'rgba(220,215,255,0)');x.fillStyle=g;x.fillRect(cx-r*3,cy-r*3,r*6,r*6);x.fillStyle='#f1eefc';circ(x,cx,cy,r);x.fillStyle='#dcd4f3';circ(x,cx-r*0.35,cy-r*0.2,r*0.22);circ(x,cx+r*0.3,cy+r*0.3,r*0.15);circ(x,cx+r*0.1,cy-r*0.5,r*0.1);circ(x,cx-r*0.2,cy+r*0.45,r*0.12);}
function star4(x,cx,cy,r,col){x.fillStyle=col;x.beginPath();x.moveTo(cx,cy-r);x.lineTo(cx+r*0.18,cy-r*0.18);x.lineTo(cx+r,cy);x.lineTo(cx+r*0.18,cy+r*0.18);x.lineTo(cx,cy+r);x.lineTo(cx-r*0.18,cy+r*0.18);x.lineTo(cx-r,cy);x.lineTo(cx-r*0.18,cy-r*0.18);x.closePath();x.fill();}
function island(x,cx,cy,w,col,R,top){x.fillStyle=col;x.beginPath();x.moveTo(cx-w/2,cy);for(let i=0;i<=8;i++)x.lineTo(cx-w/2+w*i/8,cy-2-R()*4);x.lineTo(cx+w/2,cy);const n=7;for(let i=n;i>=0;i--){const px=cx-w/2+w*i/n,dep=(1-Math.abs(i/n-0.5)*2)*w*0.55*(0.6+R()*0.5);x.lineTo(px,cy+(i%2?dep*0.7:dep));}x.closePath();x.fill();if(top){x.fillStyle=top;x.fillRect(cx-w/2+2,cy-4,w-4,2);}}
function castle(x,cx,base,s,col,win,R){x.fillStyle=col;x.fillRect(cx-46*s,base-26*s,92*s,26*s);const T=[[-42,28,8],[-30,42,10],[-15,62,12],[0,90,14],[15,56,10],[30,40,9],[44,30,8]];for(const [dx,h,w] of T){const tx=cx+dx*s,tw=w*s,th=h*s;x.fillRect(tx-tw/2,base-th,tw,th);x.beginPath();x.moveTo(tx-tw/2-1,base-th);x.lineTo(tx,base-th-tw*1.4);x.lineTo(tx+tw/2+1,base-th);x.fill();}x.fillStyle=win;for(const [dx,h] of T){const tx=cx+dx*s;for(let k=0;k<3;k++)if(R()<0.6)x.fillRect(Math.round(tx-1),Math.round(base-h*s+6*s+k*8*s),Math.max(1,Math.round(1.6*s)),Math.max(2,Math.round(2.6*s)));}}
function cloudBank(x,y,c1,c2,R,n=26,rmin=12,rmax=26){const pts=[];for(let i=0;i<n;i++)pts.push([R()*(W+60)-30,y+R()*16,rmin+R()*(rmax-rmin)]);x.fillStyle=c2;for(const p of pts)circ(x,p[0],p[1]+5,p[2]);x.fillStyle=c1;for(const p of pts)circ(x,p[0],p[1],p[2]);x.fillRect(0,y+12,W,H);}
function stars(x,R,n,maxY){for(let i=0;i<n;i++){const px=Math.floor(R()*W),py=Math.floor(R()*maxY),a=0.3+R()*0.7;x.fillStyle=`rgba(255,255,255,${a})`;x.fillRect(px,py,1,1);if(R()<0.06){x.fillRect(px-1,py,3,1);x.fillRect(px,py-1,1,3);}}}
function house(x,hx,base,w,h,R){x.fillStyle='#2f2a5e';x.fillRect(hx,base-h,w,h);x.fillStyle='#22204a';x.beginPath();x.moveTo(hx-4,base-h);x.lineTo(hx+w/2,base-h-w*0.7);x.lineTo(hx+w+4,base-h);x.fill();x.fillRect(hx+w*0.7,base-h-w*0.7,5,w*0.5);x.fillStyle='#1b183c';x.fillRect(hx+w/2-5,base-14,10,14);for(let k=0;k<4;k++){const wx=hx+5+(k%2)*(w-15),wy=base-h+8+Math.floor(k/2)*16;x.fillStyle='#ffcf6e';x.fillRect(wx,wy,5,8);x.fillStyle='#ff9f45';x.fillRect(wx,wy+5,5,3);}const g=x.createRadialGradient(hx+w/2,base-h/2,2,hx+w/2,base-h/2,w);g.addColorStop(0,'rgba(255,190,100,0.12)');g.addColorStop(1,'rgba(255,190,100,0)');x.fillStyle=g;x.fillRect(hx-w,base-h-w,w*3,h+w*2);}
function buildBG(theme,key){
  const c=mk(W,H),x=c.getContext('2d'),R=mulberry(key.length*31+theme.charCodeAt(1)*7+theme.length);
  const G0={cave:['#08061a','#171236','#251c4e'],sanctum:['#0f0828','#2a1659','#5a37a0'],village:['#171447','#3d3890','#a08ad8'],ending:['#0d1446','#3a4fb0','#c8b6f0']}[theme]||['#100d36','#2c2876','#7465c8'];
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,G0[0]);g.addColorStop(0.55,G0[1]);g.addColorStop(1,G0[2]);x.fillStyle=g;x.fillRect(0,0,W,H);
  if(theme==='cave'){
    x.fillStyle='#120e2c';for(let i=0;i<14;i++){const px=R()*W,w=20+R()*40;x.beginPath();x.moveTo(px-w/2,0);x.lineTo(px,30+R()*70);x.lineTo(px+w/2,0);x.fill();}
    x.fillStyle='#1c1640';for(let i=0;i<10;i++){const px=R()*W,w=30+R()*60;x.beginPath();x.moveTo(px-w/2,H);x.lineTo(px,H-60-R()*90);x.lineTo(px+w/2,H);x.fill();}
    for(let i=0;i<9;i++){const px=20+R()*440,py=40+R()*190,col=R()<0.6?'#4fc6ff':'#b07cff';const gg=x.createRadialGradient(px,py,0,px,py,26);gg.addColorStop(0,col+'55');gg.addColorStop(1,col+'00');x.fillStyle=gg;x.fillRect(px-26,py-26,52,52);x.fillStyle=col;for(let k=0;k<3;k++){const ox=(k-1)*4,hh=6+R()*8;x.beginPath();x.moveTo(px+ox-2,py);x.lineTo(px+ox,py-hh);x.lineTo(px+ox+2,py);x.fill();}}
    return c;
  }
  if(theme==='sanctum'){
    stars(x,R,60,180);
    x.strokeStyle='rgba(200,180,255,0.25)';x.lineWidth=1;for(const r of [70,100,130]){x.beginPath();x.arc(240,90,r,0,Math.PI*2);x.stroke();}
    x.fillStyle='rgba(200,180,255,0.35)';for(let i=0;i<24;i++){const a=i/24*Math.PI*2;x.fillRect(240+Math.cos(a)*115-1,90+Math.sin(a)*115-1,2,2);}
    for(const px of [52,428]){x.fillStyle='#2a1d55';x.fillRect(px-12,40,24,190);x.fillStyle='#3b2a72';x.fillRect(px-15,36,30,8);x.fillRect(px-15,216,30,8);x.fillStyle='#4a378a';x.fillRect(px-12,44,3,172);}
    x.strokeStyle='#2a1d55';x.lineWidth=8;x.beginPath();x.arc(240,150,190,Math.PI*1.12,Math.PI*1.88);x.stroke();
    const gg=x.createRadialGradient(240,120,10,240,120,200);gg.addColorStop(0,'rgba(190,150,255,0.35)');gg.addColorStop(1,'rgba(190,150,255,0)');x.fillStyle=gg;x.fillRect(0,0,W,H);
    return c;
  }
  stars(x,R,theme==='ending'?200:150,190);
  star4(x,theme==='village'?90:330,38,7,'rgba(220,235,255,0.9)');
  if(theme==='cliff'||theme==='sky'||theme==='ending')drawMoon(x,theme==='sky'?120:405,58,26);
  if(theme==='tower')drawMoon(x,90,50,18);
  // ilhas distantes
  for(let i=0;i<5;i++)island(x,30+R()*420,70+R()*70,24+R()*30,'rgba(70,58,140,0.75)',R);
  if(theme==='cliff'||theme==='ending'){island(x,360,170,150,'#3b3378',R,'#4a4290');castle(x,360,168,1.0,'#3b3378','#ffd27a',R);island(x,250,150,50,'#443b85',R);}
  if(theme==='sky'){island(x,380,120,90,'#4a4290',R,'#5a52a8');castle(x,380,118,0.6,'#4a4290','#ffd27a',R);x.fillStyle='rgba(180,220,255,0.55)';x.fillRect(395,125,5,90);island(x,200,90,50,'#463e8a',R);x.fillStyle='rgba(180,220,255,0.4)';x.fillRect(205,95,3,70);}
  if(theme==='ruins'){x.fillStyle='#2e2760';for(const ax of [70,230,390]){x.fillRect(ax-40,90,14,140);x.fillRect(ax+26,90,14,140);x.strokeStyle='#2e2760';x.lineWidth=12;x.beginPath();x.arc(ax,96,33,Math.PI,0);x.stroke();}x.fillStyle='#3a8a5c';for(let i=0;i<30;i++){const vx=R()*W;x.fillRect(vx,80+R()*40,1,8+R()*20);}castle(x,430,150,0.7,'#2a2458','#ffd27a',R);}
  if(theme==='tower'){x.fillStyle='#2b2560';x.fillRect(330,40,60,200);x.beginPath();x.moveTo(320,40);x.lineTo(360,-10);x.lineTo(400,40);x.fill();x.fillStyle='#ffd27a';for(let k=0;k<5;k++)x.fillRect(357,60+k*32,6,10);island(x,120,140,70,'#3a3378',R);castle(x,120,138,0.5,'#3a3378','#ffd27a',R);}
  if(theme==='village'){for(let i=0;i<4;i++)island(x,60+i*120+R()*30,60+R()*40,30,'rgba(80,68,150,0.7)',R);}
  // nuvens
  cloudBank(x,theme==='ending'?200:205,'#9f95dc','#7a6fc4',R,24,14,30);
  cloudBank(x,theme==='ending'?225:232,'#c8c0f2','#a59bdf',R,22,12,24);
  if(theme==='village'){house(x,40,226,46,60,R);house(x,120,226,38,48,R);house(x,300,226,54,70,R);house(x,380,226,40,52,R);}
  return c;
}

let G=null;
function newGame(){G={ab:{dash:false,double:false,burst:false},maxHp:5,collected:{},broken:{},visited:{},boss:false,crystals:0,cp:{room:'0,0',x:null,y:null},time:0,isNew:true};}
const SAVE_KEY='nevoa_celeste_save_v1';
function saveGame(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(G));}catch(e){}}
function loadSave(){try{const s=localStorage.getItem(SAVE_KEY);return s?JSON.parse(s):null;}catch(e){return null;}}

let mode='title',modeT=0,cur=null,curKey='',tiles=[],ents=[],parts=[],projs=[],decos=[],clouds=[],boss=null;
let tileCanvas=mk(W,H),bgCanvas=null;const bgCache={};
let shakeA=0,hitstop=0,fadeA=0,flashA=0,banner={text:'',t:0},toast={text:'',t:0},dialog=null,popup=null,titleSel=0,hasSave=false,endBG=null;
const P={x:0,y:0,w:10,h:14,vx:0,vy:0,face:1,onGround:false,coyote:0,jbuf:0,canDouble:true,canDash:true,dashT:0,dashCD:0,atkT:0,atkCD:0,atkDir:'side',hitSet:new Set(),inv:0,hurtT:0,hp:5,mana:0,anim:0,boostT:0,dropT:0,safe:{x:0,y:0},runT:0,trail:[]};
const GRAV=0.35,MAXFALL=6.2,RUN=1.75,JUMPV=-6.0,DJV=-5.6,DASHV=4.4,DASHT=12;

const isSolid=ch=>ch==='#'||ch==='='||ch==='X'||ch==='Q';
function tileAt(tx,ty){if(ty<0||ty>=ROWS||tx<0||tx>=COLS)return '.';return tiles[ty][tx];}
function moveX(o,dx){
  o.x+=dx;const t=Math.floor(o.y/TS),b=Math.floor((o.y+o.h-0.01)/TS);
  if(dx>0){const tx=Math.floor((o.x+o.w-0.01)/TS);for(let ty=t;ty<=b;ty++)if(isSolid(tileAt(tx,ty))){o.x=tx*TS-o.w;o.vx=0;o.hitWall=true;break;}}
  else if(dx<0){const tx=Math.floor(o.x/TS);for(let ty=t;ty<=b;ty++)if(isSolid(tileAt(tx,ty))){o.x=(tx+1)*TS;o.vx=0;o.hitWall=true;break;}}
}
function moveY(o,dy){
  const prevBot=o.y+o.h;o.y+=dy;o.onGround=false;const l=Math.floor(o.x/TS),r=Math.floor((o.x+o.w-0.01)/TS);
  if(dy>0){const ty=Math.floor((o.y+o.h-0.01)/TS);for(let tx=l;tx<=r;tx++){const ch=tileAt(tx,ty);if(isSolid(ch)||(ch==='-'&&prevBot<=ty*TS+0.5&&!(o.dropT>0))){o.y=ty*TS-o.h;o.vy=0;o.onGround=true;break;}}}
  else if(dy<0){const ty=Math.floor(o.y/TS);for(let tx=l;tx<=r;tx++)if(isSolid(tileAt(tx,ty))){o.y=(ty+1)*TS;o.vy=0;break;}}
}
function overlapsSolid(o){const l=Math.floor(o.x/TS),r=Math.floor((o.x+o.w-0.01)/TS),t=Math.floor(o.y/TS),b=Math.floor((o.y+o.h-0.01)/TS);for(let ty=t;ty<=b;ty++)for(let tx=l;tx<=r;tx++)if(isSolid(tileAt(tx,ty)))return true;return false;}
function unstick(o){if(!overlapsSolid(o))return;const y0=o.y;for(let d=1;d<220;d++){o.y=y0+d;if(o.y+o.h<=H&&!overlapsSolid(o))return;o.y=y0-d;if(o.y>=0&&!overlapsSolid(o))return;}o.y=y0;}
function touchingSpike(o){const l=Math.floor((o.x+2)/TS),r=Math.floor((o.x+o.w-2.01)/TS),t=Math.floor(o.y/TS),b=Math.floor((o.y+o.h-0.01)/TS);for(let ty=t;ty<=b;ty++)for(let tx=l;tx<=r;tx++)if(tileAt(tx,ty)==='^'&&o.y+o.h>ty*TS+8)return true;return false;}

// ---------- salas ----------
function loadRoom(key){
  curKey=key;cur=ROOMS[key];tiles=[];ents=[];projs=[];decos=[];parts=[];boss=null;
  const brk=G.broken[key]||{};
  for(let y=0;y<ROWS;y++)tiles.push((cur.map[y]||'').padEnd(COLS,'.').slice(0,COLS).split(''));
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const ch=tiles[y][x],px=x*TS,py=y*TS,id=key+':'+x+','+y;
    switch(ch){
      case '@':cur.start={x:px+3,y:py+2};break;
      case 'E':ents.push({type:'walker',x:px+1,y:py+4,w:14,h:12,vx:hash(x,y)<0.5?-0.5:0.5,vy:0,hp:3,flash:0,kbT:0,kbx:0,t:0});break;
      case 'B':ents.push({type:'bat',x:px+2,y:py+3,w:12,h:10,hx:px+2,hy:py+3,vx:0,vy:0,hp:2,flash:0,kbT:0,kbx:0,t:hash(x,y)*100});break;
      case 'c':if(!G.collected[id])ents.push({type:'crystal',x:px+4,y:py+2,w:8,h:12,id,t:hash(x,y)*10});break;
      case 'H':if(!G.collected[id])ents.push({type:'heart',x:px+2,y:py+2,w:12,h:12,id,t:0});break;
      case '1':case '2':case '3':{const ab=['dash','double','burst'][+ch-1];if(!G.ab[ab])ents.push({type:'orb',ab,x:px+2,y:py+1,w:12,h:12,id,t:0});break;}
      case 'N':ents.push({type:'npc',x:px+2,y:py,w:12,h:16,t:0});break;
      case 'S':ents.push({type:'shrine',x:px,y:py,w:16,h:16,t:0});break;
      case 'G':if(!G.boss)boss=makeBoss();break;
      case 'T':case 'F':case 'L':case 'P':decos.push({ch,x,y});break;
    }
    if(ch==='X'&&brk[x+','+y])tiles[y][x]='.';
    if(!'#=-^X.'.includes(tiles[y][x]))tiles[y][x]='.';
  }
  if(!cur.start)cur.start={x:40,y:200};
  G.visited[key]=true;
  bgCanvas=bgCache[key]||(bgCache[key]=buildBG(cur.theme,key));
  const R=mulberry(key.length*13+5);clouds=[];
  if(cur.theme!=='cave'&&cur.theme!=='sanctum')for(let i=0;i<5;i++)clouds.push({x:R()*W,y:20+R()*150,s:0.05+R()*0.12,i:i%3,a:0.25+R()*0.35});
  buildTiles();banner={text:cur.name,t:160};fadeA=Math.max(fadeA,0.7);
}
function buildTiles(){
  const x=tileCanvas.getContext('2d');x.clearRect(0,0,W,H);
  const th=cur.theme,outdoor=th!=='cave'&&th!=='sanctum';
  for(const d of decos)drawDeco(x,d,th);
  for(let ty=0;ty<ROWS;ty++)for(let tx=0;tx<COLS;tx++){
    const ch=tiles[ty][tx],px=tx*TS,py=ty*TS;
    if(ch==='#'||ch==='='){
      const pal=th==='cave'?['#1a1537','#2b2453','#352c63','#41387a']:th==='sanctum'?['#1c1540','#2e2358','#382a6a','#46377e']:['#25204a','#3a3468','#433c75','#514a8a'];
      x.fillStyle=pal[0];x.fillRect(px,py,16,16);
      for(let r=0;r<2;r++){const gy=ty*2+r,by=py+r*8,off=(gy&1)?8:0;const bx0=px-((px+off)%16);
        for(let bx=bx0;bx<px+16;bx+=16){const sx=Math.max(bx+1,px),ex=Math.min(bx+16,px+16);if(ex>sx){const v=hash(bx,gy);x.fillStyle=v<0.4?pal[1]:v<0.8?pal[2]:pal[3];x.fillRect(sx,by+1,ex-sx,7);x.fillStyle='rgba(255,255,255,0.06)';x.fillRect(sx,by+1,ex-sx,1);}}}
      for(let k=0;k<3;k++){if(hash(tx,ty,k)<0.5){x.fillStyle='rgba(0,0,0,0.25)';x.fillRect(px+Math.floor(hash(tx,ty,k+9)*15),py+Math.floor(hash(tx,ty,k+19)*15),1,1);}}
      const up=tileAt(tx,ty-1),dn=tileAt(tx,ty+1),lf=tileAt(tx-1,ty),rt=tileAt(tx+1,ty);
      if(!isSolid(lf)&&tx>0){x.fillStyle='rgba(0,0,0,0.3)';x.fillRect(px,py,1,16);}
      if(!isSolid(rt)&&tx<COLS-1){x.fillStyle='rgba(0,0,0,0.3)';x.fillRect(px+15,py,1,16);}
      if(!isSolid(dn)&&ty<ROWS-1){x.fillStyle='rgba(0,0,0,0.35)';x.fillRect(px,py+14,16,2);
        if(outdoor)for(let i=0;i<16;i+=3)if(hash(px+i,py,3)<0.3){const len=3+Math.floor(hash(px+i,py,4)*11);x.fillStyle='#2f6a4c';x.fillRect(px+i,py+16,1,len);x.fillStyle='#57a86a';if(len>5)x.fillRect(px+i+1,py+16+Math.floor(len/2),1,1);}
        if(th==='cave'&&hash(tx,ty,8)<0.3){x.fillStyle='#5fc8ff';x.fillRect(px+6,py+16,2,3);x.fillRect(px+7,py+19,1,2);}}
      if(!isSolid(up)&&up!=='^'){
        if(outdoor){x.fillStyle='#3d7b55';x.fillRect(px,py,16,4);x.fillStyle='#69bb6d';x.fillRect(px,py,16,2);
          for(let i=0;i<16;i++){const v=hash(px+i,py,1);if(v<0.3){x.fillStyle='#8fd486';x.fillRect(px+i,py-1,1,1);}else if(v>0.88){x.fillStyle='#3d7b55';x.fillRect(px+i,py+4,1,2);}}
          if(hash(tx,ty,5)<0.18){const fx=px+3+Math.floor(hash(tx,ty,6)*10);x.fillStyle='#4f9a5e';x.fillRect(fx,py-3,1,3);x.fillStyle=hash(tx,ty,7)<0.5?'#f08ac0':'#ffe28a';x.fillRect(fx-1,py-4,3,1);x.fillRect(fx,py-5,1,1);}}
        else if(th==='cave'){x.fillStyle='#4b3f8e';x.fillRect(px,py,16,2);if(hash(tx,ty,5)<0.25){x.fillStyle='#6fe0ff';x.fillRect(px+5,py-3,2,3);x.fillRect(px+8,py-2,1,2);}}
        else{x.fillStyle='#7d6bc4';x.fillRect(px,py,16,2);}
      }
    }else if(ch==='-'){
      x.fillStyle='#211c44';x.fillRect(px,py,16,6);x.fillStyle='#938cc6';x.fillRect(px,py,16,2);x.fillStyle='#5f5898';x.fillRect(px,py+2,16,3);
      x.fillStyle='rgba(0,0,0,0.3)';x.fillRect(px+((tx*5)%13),py+2,1,3);
      if(tileAt(tx-1,ty)!=='-'){x.fillStyle='#3a3468';x.fillRect(px+1,py+6,3,3);x.fillRect(px+2,py+9,1,2);}
      if(tileAt(tx+1,ty)!=='-'){x.fillStyle='#3a3468';x.fillRect(px+12,py+6,3,3);x.fillRect(px+13,py+9,1,2);}
      if(outdoor&&hash(tx,ty,2)<0.4){x.fillStyle='#5aa868';x.fillRect(px+4,py-1,3,1);}
    }else if(ch==='^'){
      x.fillStyle='#2a2450';x.fillRect(px,py+14,16,2);
      for(let i=0;i<4;i++){const sx=px+i*4;x.fillStyle='#cfcbef';x.beginPath();x.moveTo(sx,py+15);x.lineTo(sx+2,py+7);x.lineTo(sx+2,py+15);x.fill();x.fillStyle='#7d78a8';x.beginPath();x.moveTo(sx+2,py+7);x.lineTo(sx+4,py+15);x.lineTo(sx+2,py+15);x.fill();}
    }else if(ch==='X'){
      x.fillStyle='rgba(60,170,230,0.55)';x.fillRect(px+2,py,12,16);x.fillStyle='rgba(190,240,255,0.7)';x.fillRect(px+3,py,2,16);
      x.fillStyle='rgba(30,110,180,0.8)';x.fillRect(px+12,py,2,16);x.fillStyle='rgba(220,250,255,0.6)';x.fillRect(px+6,py+((ty*7)%12),4,1);
    }
  }
}
function drawDeco(x,d,th){
  const px=d.x*TS,base=d.y*TS+16;
  if(d.ch==='T'){
    x.fillStyle='#3b2a44';x.fillRect(px+6,base-30,4,30);x.fillRect(px+3,base-2,10,2);x.fillRect(px+9,base-22,4,2);
    const cols=th==='village'?['#24533f','#3c8655','#6fbf72']:['#6a2a66','#b9508f','#ef92c6'];
    const R=mulberry(d.x*17+d.y);const bl=[];for(let i=0;i<6;i++)bl.push([px+8+(R()-0.5)*20,base-36+(R()-0.5)*14,7+R()*6]);
    x.fillStyle=cols[0];for(const b of bl)circ(x,b[0],b[1]+2,b[2]);x.fillStyle=cols[1];for(const b of bl)circ(x,b[0]-1,b[1],b[2]-1.5);x.fillStyle=cols[2];for(const b of bl)circ(x,b[0]-2,b[1]-2,b[2]*0.4);
  }else if(d.ch==='F'){
    for(let i=0;i<5;i++){const fx=px+2+i*3,h=3+((d.x+i)*7)%4;x.fillStyle='#4f9a5e';x.fillRect(fx,base-h,1,h);x.fillStyle=i%2?'#f08ac0':'#c9a8ff';x.fillRect(fx-1,base-h-1,3,2);}
  }else if(d.ch==='L'){
    x.fillStyle='#231d3d';x.fillRect(px+7,base-30,2,30);x.fillRect(px+4,base-2,8,2);x.fillRect(px+5,base-36,6,2);x.fillStyle='#ffcf6e';x.fillRect(px+5,base-34,6,5);x.fillStyle='#fff3c4';x.fillRect(px+7,base-33,2,3);
  }else if(d.ch==='P'){
    x.fillStyle='#3e3772';x.fillRect(px+3,base-44,10,44);x.fillStyle='#544c92';x.fillRect(px+3,base-44,3,44);x.fillStyle='#2b2556';x.fillRect(px+1,base-4,14,4);
    x.beginPath();x.moveTo(px+3,base-44);x.lineTo(px+6,base-49);x.lineTo(px+9,base-45);x.lineTo(px+13,base-50);x.lineTo(px+13,base-44);x.fillStyle='#3e3772';x.fill();
    x.fillStyle='#2f6a4c';x.fillRect(px+10,base-40,1,14);x.fillRect(px+5,base-30,1,9);
  }
}

// ---------- partículas ----------
function part(x,y,vx,vy,life,c,s=1,g=0,glow=false){parts.push({x,y,vx,vy,life,max:life,c,s,g,glow});}
function burstParts(x,y,n,cols,spd=2,life=30,g=0.05,glow=false){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=Math.random()*spd;part(x,y,Math.cos(a)*v,Math.sin(a)*v,life*(0.5+Math.random()*0.5),cols[i%cols.length],Math.random()<0.3?2:1,g,glow);}}
function updateParts(){for(const p of parts){if(p.ring){p.r+=(p.maxR-p.r)*0.15;p.life--;continue;}p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=0.97;p.life--;}parts=parts.filter(p=>p.life>0);if(parts.length>500)parts.splice(0,parts.length-500);}
function shake(a){shakeA=Math.max(shakeA,a);}

// ---------- chefe ----------
function makeBoss(){return {hp:32,max:32,active:false,state:'wait',t:0,ft:0,cx:240,cy:110,flash:0,alpha:0,phase:1,cycle:0,side:0,hands:[{x:90,y:130,bx:90,by:130,mode:'idle'},{x:390,y:130,bx:390,by:130,mode:'idle'}]};}
function bossState(s){boss.state=s;boss.t=0;}
function updateBoss(){
  const b=boss;b.ft++;if(b.flash>0)b.flash--;
  if(b.state==='gone'){b.alpha=Math.max(0.25,b.alpha-0.01);return;}
  if(!b.active){if(P.x<25*TS){b.active=true;bossState('intro');for(let y=1;y<=13;y++)tiles[y][29]='Q';SFX.boss();shake(4);banner={text:'Guardiã da Névoa',t:200,boss:true};}return;}
  b.t++;const ph2=b.phase===2;
  for(let i=0;i<2;i++){const h=b.hands[i];if(h.mode==='idle'){h.x+=(h.bx+Math.sin(b.ft*0.03+i*2)*12-h.x)*0.06;h.y+=(h.by+Math.cos(b.ft*0.025+i)*10-h.y)*0.06;}}
  switch(b.state){
    case 'intro':b.alpha=Math.min(1,b.t/90);b.cx+=(240-b.cx)*0.05;b.cy+=(110-b.cy)*0.05;if(b.t>120)bossState('float');break;
    case 'float':{
      b.cx+=(240+Math.sin(b.ft*0.018*(ph2?1.4:1))*150-b.cx)*0.05;b.cy+=(160+Math.sin(b.ft*0.037)*20-b.cy)*0.05;
      if(ph2&&b.t%70===35){const a=Math.atan2(P.y+7-b.cy,P.x+5-b.cx);for(let k=-1;k<=1;k++)projs.push({kind:'orb',x:b.cx,y:b.cy,vx:Math.cos(a+k*0.25)*1.8,vy:Math.sin(a+k*0.25)*1.8,r:4,life:400});SFX.orb();}
      if(b.t>(ph2?130:180)){const order=['orbs','sweep','rain'];const nx=ph2?order[Math.floor(Math.random()*3)]:order[b.cycle%3];b.cycle++;bossState(nx);}
      break;}
    case 'orbs':{
      b.cx+=(240-b.cx)*0.05;b.cy+=(95-b.cy)*0.05;const iv=ph2?24:34,vol=3;
      if(b.t>30&&(b.t-30)%iv===0&&b.t<=30+iv*(vol-1)){const n=ph2?12:8,off=b.t*0.13;for(let i=0;i<n;i++){const a=off+i*Math.PI*2/n;projs.push({kind:'orb',x:b.cx,y:b.cy,vx:Math.cos(a)*1.5,vy:Math.sin(a)*1.5,r:4,life:420});}SFX.orb();shake(1);}
      if(b.t>30+iv*vol+50)bossState('float');break;}
    case 'rain':{
      b.cx+=(240-b.cx)*0.05;b.cy+=(80-b.cy)*0.05;
      if(b.t===1){const n=ph2?9:6;for(let i=0;i<n;i++)projs.push({kind:'shard',x:40+(i+0.2+Math.random()*0.6)*(400/n),y:-10,vx:0,vy:0,r:4,delay:50+i*(ph2?5:9),life:500});}
      if(b.t>150)bossState('float');break;}
    case 'sweep':{
      b.cx+=(240-b.cx)*0.04;b.cy+=(110-b.cy)*0.04;
      if(b.t===1){b.side=P.x+5<240?1:0;const h=b.hands[b.side];h.mode='sweep';h.dir=b.side===0?1:-1;h.sx=b.side===0?-34:W+34;}
      const h=b.hands[b.side];
      if(h.mode==='sweep'){
        if(b.t<55){h.x+=(h.sx-h.x)*0.12;h.y+=(212-h.y)*0.12;}
        else{h.x+=h.dir*(ph2?6:4.6);if(b.t%3===0)part(h.x,h.y+10,-h.dir*Math.random(),-Math.random()*1.5,25,'#d9ccff',1,0.02,true);
          if(overlap(P,{x:h.x-15,y:h.y-10,w:30,h:22}))hurt(1,h.x);
          if((h.dir>0&&h.x>W+40)||(h.dir<0&&h.x<-40)){h.mode='idle';h.x=h.bx;h.y=h.by-80;bossState('float');}}
      }
      break;}
    case 'dying':{
      b.cx+=(240-b.cx)*0.05;b.cy+=(120-b.cy)*0.05;
      if(b.t%3===0)burstParts(b.cx+(Math.random()-0.5)*30,b.cy+(Math.random()-0.5)*30,4,['#ffffff','#bfe9ff','#cbb8ff'],2.5,40,0,true);
      if(b.t%12===0){SFX.hit();shake(3);}
      if(b.t===150){
        flashA=1;shake(8);G.boss=true;b.state='gone';
        for(let y=1;y<=13;y++)if(tiles[y][29]==='Q')tiles[y][29]='.';buildTiles();
        burstParts(b.cx,b.cy,120,['#ffffff','#bfe9ff','#cbb8ff','#ffd27a'],5,90,0,true);saveGame();
        setTimeout(()=>startDialog('Guardiã da Névoa',['...','A luz... eu me lembro agora.','Por séculos a névoa me aprisionou — e eu aprisionei o céu.','Obrigada, pequena estrela. Os céus estão livres outra vez.'],()=>{mode='ending';modeT=0;endBG=endBG||buildBG('ending','end');}),900);
      }
      break;}
  }
  if(b.state!=='dying'&&b.state!=='intro'&&P.inv<=0&&Math.hypot(P.x+5-b.cx,P.y+7-b.cy)<16)hurt(1,b.cx);
}
function hitBoss(d){
  const b=boss;if(!b||!b.active||b.state==='intro'||b.state==='dying'||b.state==='gone')return;
  b.hp-=d;b.flash=8;SFX.hit();burstParts(b.cx,b.cy,10,['#ffffff','#bfe9ff'],2.5,20,0,true);P.mana=Math.min(100,P.mana+6);
  if(b.phase===1&&b.hp<=b.max/2){b.phase=2;shake(5);toast={text:'A Guardiã desperta sua fúria!',t:150};}
  if(b.hp<=0){b.hp=0;projs=[];bossState('dying');b.hands.forEach(h=>h.mode='idle');}
}

// ---------- jogador ----------
function hurt(d,sx,hazard=false){
  if(mode!=='play')return;
  if(P.inv>0&&!hazard)return;
  if(P.inv<=0){P.hp-=d;P.inv=75;SFX.hurt();shake(4);hitstop=6;burstParts(P.x+5,P.y+7,12,['#e23a52','#ffffff'],2,25,0.1);}
  if(P.hp<=0){die();return;}
  if(hazard){P.x=P.safe.x;P.y=P.safe.y;P.vx=0;P.vy=0;P.dashT=0;fadeA=0.8;}
  else{P.vx=(P.x+5<sx?-1:1)*3;P.vy=-3.5;P.hurtT=12;P.dashT=0;}
}
function die(){mode='dead';modeT=0;SFX.die();burstParts(P.x+5,P.y+7,40,['#e23a52','#f3f4ff','#cbb8ff'],3,60,0.05,true);}
function respawn(){
  loadRoom(G.cp.room);const st=cur.start;P.x=G.cp.x!=null?G.cp.x:st.x;P.y=G.cp.y!=null?G.cp.y:st.y;
  P.vx=P.vy=0;P.hp=G.maxHp;P.inv=60;P.dashT=0;P.safe={x:P.x,y:P.y};mode='play';modeT=0;fadeA=1;
}
function enterRoom(k,dir){
  const vy=P.vy;loadRoom(k);
  if(dir==='L')P.x=W-P.w-1;if(dir==='R')P.x=1;if(dir==='U'){P.y=H-P.h-1;P.vy=Math.min(vy,-6.8);P.boostT=20;}if(dir==='D')P.y=1;
  unstick(P);P.safe={x:P.x,y:P.y};
}
function checkEdges(){
  const [rx,ry]=curKey.split(',').map(Number),has=(a,b)=>!!ROOMS[a+','+b];
  if(P.x<0&&!has(rx-1,ry)){P.x=0;}
  if(P.x+P.w>W&&!has(rx+1,ry)){P.x=W-P.w;}
  if(P.y<0&&!has(rx,ry-1)){P.y=0;if(P.vy<0)P.vy=0;}
  const cx=P.x+P.w/2;
  if(cx<0)enterRoom((rx-1)+','+ry,'L');
  else if(cx>W)enterRoom((rx+1)+','+ry,'R');
  else if(P.y<-2)enterRoom(rx+','+(ry-1),'U');
  else if(P.y+P.h/2>H){if(has(rx,ry+1))enterRoom(rx+','+(ry+1),'D');else hurt(1,P.x,true);}
}
function atkBox(){const p=P;if(p.atkDir==='up')return{x:p.x-6,y:p.y-20,w:22,h:22};if(p.atkDir==='down')return{x:p.x-6,y:p.y+p.h-2,w:22,h:20};return p.face>0?{x:p.x+p.w-2,y:p.y-4,w:24,h:20}:{x:p.x-22,y:p.y-4,w:24,h:20};}
function nearEnt(type){return ents.find(e=>e.type===type&&Math.abs(P.x+5-(e.x+e.w/2))<20&&Math.abs(P.y+P.h-(e.y+e.h))<18);}
function updatePlayer(){
  const p=P;p.anim++;
  if(p.inv>0)p.inv--;if(p.atkCD>0)p.atkCD--;if(p.dashCD>0)p.dashCD--;if(p.boostT>0)p.boostT--;if(p.dropT>0)p.dropT--;
  let mx=(K.right()?1:0)-(K.left()?1:0);
  if(p.hurtT>0){p.hurtT--;mx=0;}
  if(A.jump())p.jbuf=7;else if(p.jbuf>0)p.jbuf--;
  // interação
  if(A.interact()&&p.onGround&&!K.down()){
    const n=nearEnt('npc'),s=nearEnt('shrine');
    if(n){talkNPC();return;}
    if(s){useShrine(s);return;}
  }
  if(G.ab.dash&&A.dash()&&p.canDash&&p.dashCD<=0&&p.dashT<=0){p.dashT=DASHT;p.canDash=false;p.dashCD=26;if(mx)p.face=mx;p.vy=0;SFX.dash();shake(1);}
  if(p.dashT>0){p.dashT--;p.vx=p.face*DASHV;p.vy=0;p.trail.push({x:p.x,y:p.y,f:p.face,a:0.6});if(p.dashT%2===0)part(p.x+5,p.y+7+(Math.random()-0.5)*8,-p.face*0.5,0,18,'#bfe9ff',1,0,true);}
  else{const tgt=mx*RUN;p.vx+=(tgt-p.vx)*(p.onGround?0.35:0.22);if(mx&&p.atkT<=0)p.face=mx;p.vy=Math.min(p.vy+GRAV,MAXFALL);}
  if(p.onGround){p.coyote=6;p.canDouble=true;if(p.dashCD<=12)p.canDash=true;}else if(p.coyote>0)p.coyote--;
  if(p.jbuf>0&&p.dashT<=0){
    const l=Math.floor(p.x/TS),r=Math.floor((p.x+p.w-0.01)/TS),ty=Math.floor((p.y+p.h+1)/TS);
    const onOneWay=p.onGround&&[l,r].every(tx=>!isSolid(tileAt(tx,ty)))&&[l,r].some(tx=>tileAt(tx,ty)==='-');
    if(K.down()&&onOneWay){p.dropT=12;p.jbuf=0;p.y+=2;p.onGround=false;p.coyote=0;}
    else if(p.coyote>0){p.vy=JUMPV;p.coyote=0;p.jbuf=0;p.onGround=false;SFX.jump();for(let i=0;i<5;i++)part(p.x+5,p.y+p.h,(Math.random()-0.5)*1.5,-Math.random()*0.6,18,'#d8d2f5');}
    else if(G.ab.double&&p.canDouble){p.vy=DJV;p.canDouble=false;p.jbuf=0;SFX.djump();for(let i=0;i<10;i++)part(p.x+5+(Math.random()-0.5)*10,p.y+p.h,(Math.random()-0.5)*2,Math.random()*1.5,25,i%2?'#ffffff':'#bfe9ff',1,0.02,true);}
  }
  if(!K.jump()&&p.vy<-2.2&&p.boostT<=0&&p.hurtT<=0)p.vy*=0.6;
  // ataque
  if(A.attack()&&p.atkCD<=0){p.atkT=10;p.atkCD=17;p.atkDir=K.up()?'up':(K.down()&&!p.onGround?'down':'side');p.hitSet=new Set();SFX.slash();}
  // explosão de luz
  if(G.ab.burst&&A.burst()){
    if(p.mana>=33){p.mana-=33;SFX.burst();shake(5);hitstop=4;const cx=p.x+5,cy=p.y+7;
      parts.push({ring:true,x:cx,y:cy,r:4,maxR:78,life:28,max:28});burstParts(cx,cy,40,['#fff6d0','#ffd27a','#ffffff'],4,40,0,true);
      for(const e of ents)if((e.type==='walker'||e.type==='bat')&&Math.hypot(e.x+e.w/2-cx,e.y+e.h/2-cy)<72)hitEnemy(e,3,Math.sign(e.x-p.x)||1);
      if(boss&&Math.hypot(boss.cx-cx,boss.cy-cy)<84)hitBoss(3);
      for(const pr of projs)if(Math.hypot(pr.x-cx,pr.y-cy)<72)pr.life=0;
      let broke=false;for(let ty=0;ty<ROWS;ty++)for(let tx=0;tx<COLS;tx++)if(tiles[ty][tx]==='X'&&Math.hypot(tx*TS+8-cx,ty*TS+8-cy)<80){
        tiles[ty][tx]='.';(G.broken[curKey]=G.broken[curKey]||{})[tx+','+ty]=1;broke=true;burstParts(tx*TS+8,ty*TS+8,8,['#bfefff','#5fc8ff','#ffffff'],2.5,40,0.08,true);}
      if(broke){buildTiles();toast={text:'A barreira de cristal se despedaçou!',t:150};}
    }else toast={text:'Mana insuficiente',t:60};
  }
  const prevG=p.onGround,prevVy=p.vy;
  p.hitWall=false;moveX(p,p.vx);moveY(p,p.vy);
  if(p.onGround&&!prevG&&prevVy>3){SFX.land();for(let i=0;i<6;i++)part(p.x+5,p.y+p.h,(Math.random()-0.5)*2,-Math.random()*0.8,16,'#d8d2f5');}
  if(p.onGround&&Math.abs(p.vx)>0.3)p.runT++;
  if(p.atkT>0){
    p.atkT--;const hb=atkBox();let hitAny=false;
    for(const e of ents)if((e.type==='walker'||e.type==='bat')&&!p.hitSet.has(e)&&overlap(hb,e)){p.hitSet.add(e);hitEnemy(e,1,p.atkDir==='side'?p.face:(Math.sign(e.x-p.x)||1));hitAny=true;}
    if(boss&&!p.hitSet.has(boss)&&overlap(hb,{x:boss.cx-11,y:boss.cy-11,w:22,h:22})){p.hitSet.add(boss);hitBoss(1);hitAny=true;hitstop=3;}
    if(p.atkDir==='down'&&!p.hitSet.has('spk')&&touchingSpike(hb)){p.hitSet.add('spk');hitAny=true;SFX.hit();}
    if(hitAny&&p.atkDir==='down'){p.vy=-5.4;p.canDouble=true;p.canDash=true;}
    else if(hitAny&&p.atkDir==='side'&&p.onGround)p.vx-=p.face*1.2;
  }
  for(const t of p.trail)t.a-=0.06;p.trail=p.trail.filter(t=>t.a>0);
  if(touchingSpike(p)){hurt(1,p.x,true);return;}
  if(p.onGround&&p.inv<50){const l=Math.floor((p.x-3)/TS),r=Math.floor((p.x+p.w+3)/TS),ty=Math.floor((p.y+p.h+1)/TS);const ok=[l,r].every(tx=>{const c=tileAt(tx,ty);return isSolid(c)||c==='-';});if(ok)p.safe={x:p.x,y:p.y};}
  if(G.ab.burst&&p.anim%30===0)p.mana=Math.min(100,p.mana+1);
}
function hitEnemy(e,d,dir){
  e.hp-=d;e.flash=8;e.kbx=dir*3;e.kbT=8;SFX.hit();hitstop=Math.max(hitstop,3);P.mana=Math.min(100,P.mana+8);
  burstParts(e.x+e.w/2,e.y+e.h/2,8,['#ffffff','#bfe9ff'],2.5,15);
  if(e.hp<=0){e.dead=true;burstParts(e.x+e.w/2,e.y+e.h/2,22,['#1a1534','#3b2f70','#8ff2ff'],2.2,40,-0.02);shake(2);}

// ---------- entidades ----------
function updateEnt(e){
  e.t=(e.t||0)+1;if(e.flash>0)e.flash--;
  if(e.type==='walker'){
    e.hitWall=false;
    if(e.kbT>0){e.kbT--;moveX(e,e.kbx);e.kbx*=0.85;}
    else{moveX(e,e.vx);if(e.hitWall)e.vx=-e.vx;else if(e.onGround){const ax=e.vx>0?e.x+e.w+1:e.x-1,ty=Math.floor((e.y+e.h+2)/TS),c=tileAt(Math.floor(ax/TS),ty);if(!isSolid(c)&&c!=='-')e.vx=-e.vx;}
      if(e.x<0){e.x=0;e.vx=Math.abs(e.vx);}if(e.x+e.w>W){e.x=W-e.w;e.vx=-Math.abs(e.vx);}}
    e.vy=Math.min(e.vy+GRAV,6);moveY(e,e.vy);
  }else if(e.type==='bat'){
    const dx=P.x+5-(e.x+6),dy=P.y+7-(e.y+5),d=Math.hypot(dx,dy);
    if(e.kbT>0){e.kbT--;e.x+=e.kbx;e.kbx*=0.85;}
    else if(d<130){e.vx+=Math.sign(dx)*0.045;e.vy+=Math.sign(dy)*0.04;}
    else{e.vx+=Math.sign(e.hx-e.x)*0.02;e.vy+=Math.sign(e.hy-e.y)*0.02;}
    e.vx=clamp(e.vx*0.98,-1.15,1.15);e.vy=clamp(e.vy*0.98,-1,1);e.x+=e.vx;e.y+=e.vy+Math.sin(e.t*0.12)*0.35;
    e.x=clamp(e.x,0,W-e.w);e.y=clamp(e.y,0,H-e.h-16);
  }else if(e.type==='crystal'||e.type==='heart'||e.type==='orb'){if(overlap(P,e))collect(e);}
  if((e.type==='walker'||e.type==='bat')&&P.inv<=0&&overlap(P,{x:e.x+2,y:e.y+2,w:e.w-4,h:e.h-3}))hurt(1,e.x+e.w/2);
}
function updateProjs(){
  for(const p of projs){
    if(p.kind==='shard'&&p.delay>0){p.delay--;if(p.delay===0)p.vy=4.6;continue;}
    p.x+=p.vx;p.y+=p.vy;p.life--;
    if(p.kind==='orb'&&p.life%4===0)part(p.x,p.y,0,0,14,'#cbb8ff',1,0,true);
    if(isSolid(tileAt(Math.floor(p.x/TS),Math.floor(p.y/TS)))||p.x<-20||p.x>W+20||p.y>H+20){p.life=0;burstParts(p.x,p.y,6,['#cbb8ff','#ffffff'],1.5,18,0.05,true);continue;}

// ---------- loop ----------
function update(){
  modeT++;musicTick();
  if(jp('KeyN')){musicOn=!musicOn;toast={text:musicOn?'Música: ligada':'Música: desligada',t:80};}
  if(shakeA>0){shakeA*=0.86;if(shakeA<0.3)shakeA=0;}
  if(fadeA>0)fadeA=Math.max(0,fadeA-0.05);if(flashA>0)flashA=Math.max(0,flashA-0.02);
  if(banner.t>0)banner.t--;if(toast.t>0)toast.t--;
  for(const c of clouds){c.x+=c.s;if(c.x>W+10)c.x=-100;}
  switch(mode){
    case 'title':updateTitle();P.anim++;break;
    case 'play':updatePlay();break;
    case 'dialog':{updateParts();if(boss)updateBossPassive();const d=dialog,line=d.lines[d.i];
      if(d.ch<line.length){d.ch+=0.8;if(A.confirm()&&modeT>4)d.ch=line.length;}
      else if(A.confirm()){d.i++;d.ch=0;if(d.i>=d.lines.length){dialog=null;mode='play';d.onEnd&&d.onEnd();}}break;}
    case 'popup':updateParts();if(modeT>40&&A.confirm()){mode='play';popup=null;}break;
    case 'map':if(modeT>2&&(A.map()||A.pause()||A.confirm()))mode='play';break;
    case 'pause':if(modeT>2&&(A.pause()||jp('Enter')))mode='play';break;
    case 'dead':updateParts();if(modeT>110)respawn();break;
    case 'ending':if(modeT>150&&jp('Enter','Space','KeyZ')){mode='title';modeT=0;hasSave=!!loadSave();titleSel=0;newGame();loadRoom('0,0');setTitlePlayer();}break;
  }
}
function updateBossPassive(){boss.ft++;if(boss.state==='gone')boss.alpha=Math.max(0.25,boss.alpha-0.01);}
function updatePlay(){
  if(A.pause()){mode='pause';modeT=0;return;}
  if(A.map()){mode='map';modeT=0;return;}
  G.time++;
  if(hitstop>0){hitstop--;return;}
  updatePlayer();if(mode!=='play')return;
  for(const e of ents)updateEnt(e);ents=ents.filter(e=>!e.dead);
  if(boss)updateBoss();
  updateProjs();updateParts();
  if(mode==='play')checkEdges();
  if(Math.random()<0.15){const th=cur.theme;part(Math.random()*W,Math.random()*H,(Math.random()-0.5)*0.2,-0.1-Math.random()*0.2,120,th==='cave'?'#6fd8ff':th==='sanctum'?'#cbb8ff':'#e8e2ff',1,0,true);}
}

function updateTitle(){
  const opts=hasSave?['Continuar','Novo Jogo']:['Novo Jogo'];
  if(jp('ArrowUp','KeyW'))titleSel=(titleSel+opts.length-1)%opts.length;

function drawEndingBG(){

// ---------- UI (texto nítido) ----------
function txt(s,x,y,size=8,col='#fff',align='left',font=UIF,shadow=true){dctx.font=`${size}px ${font}`;dctx.textAlign=align;dctx.textBaseline='top';if(shadow){dctx.fillStyle='rgba(0,0,0,0.6)';dctx.fillText(s,x+0.6,y+0.6);}dctx.fillStyle=col;dctx.fillText(s,x,y);}
function wrap(s,maxW,size){dctx.font=`${size}px ${UIF}`;const words=s.split(' '),lines=[];let l='';for(const w of words){const t=l?l+' '+w:w;if(dctx.measureText(t).width>maxW&&l){lines.push(l);l=w;}else l=t;}if(l)lines.push(l);return lines;}
function panel(x,y,w,h,a=0.9){dctx.fillStyle=`rgba(14,12,40,${a})`;dctx.fillRect(x,y,w,h);dctx.strokeStyle='#cfcaf3';dctx.lineWidth=0.8;dctx.strokeRect(x+0.5,y+0.5,w-1,h-1);dctx.strokeStyle='rgba(120,110,200,0.6)';dctx.strokeRect(x+2.5,y+2.5,w-5,h-5);
  dctx.fillStyle='#cfcaf3';for(const [cx,cy] of [[x+1,y+1],[x+w-1,y+1],[x+1,y+h-1],[x+w-1,y+h-1]]){dctx.beginPath();dctx.moveTo(cx,cy-3);dctx.lineTo(cx+3,cy);dctx.lineTo(cx,cy+3);dctx.lineTo(cx-3,cy);dctx.fill();}}
const fmtTime=f=>{const s=Math.floor(f/60);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;};

    dctx.strokeStyle='rgba(220,230,255,0.7)';dctx.lineWidth=1;dctx.beginPath();dctx.moveTo(60,112);dctx.quadraticCurveTo(170,124,300,104);dctx.stroke();

    txt('Os céus estão livres outra vez.',W/2,76,11,'#e6e2ff','center');

  if(banner.t>0&&(mode==='play'||mode==='dialog')){const a=Math.min(1,banner.t/30,(160-banner.t+30)/30);dctx.globalAlpha=clamp(a,0,1);const y=banner.boss?92:44;
    dctx.save();dctx.shadowColor='rgba(170,150,255,0.9)';dctx.shadowBlur=6;txt(banner.text,W/2,y,banner.boss?20:14,'#ffffff','center',TF,false);dctx.restore();
    dctx.strokeStyle='rgba(220,215,255,0.7)';dctx.lineWidth=0.7;dctx.beginPath();dctx.moveTo(W/2-90,y+(banner.boss?28:21));dctx.lineTo(W/2+90,y+(banner.boss?28:21));dctx.stroke();dctx.globalAlpha=1;}
  if(boss&&boss.active&&boss.state!=='gone')txt('Guardiã da Névoa',W/2,H-26,8,'#e6d6ff','center',TF);
  if(toast.t>0){dctx.globalAlpha=Math.min(1,toast.t/20);const w=Math.min(380,toast.text.length*4.6+24);panel(W/2-w/2,H-48,w,18,0.85);txt(toast.text,W/2,H-43,8,'#ffffff','center');dctx.globalAlpha=1;}
  if(mode==='dialog'&&dialog){

  }
  if(mode==='popup'&&popup){

    C.forEach(([k,v],i)=>{txt(k,W/2-104,80+i*14,8,'#ffe7a8');txt(v,W/2-30,80+i*14,8,'#e6e2ff');});

  }
  if(mode==='dead'){const a=Math.min(1,modeT/60);dctx.globalAlpha=a;txt('A névoa te envolve...',W/2,H/2-10,16,'#ffffff','center',TF);dctx.globalAlpha=1;}
}
function drawMapUI(blink){
  dctx.fillStyle='rgba(8,6,26,0.92)';dctx.fillRect(0,0,W,H);txt('Mapa das Ilhas',W/2,12,16,'#ffffff','center',TF);
  const cw=84,ch=46,ox=W/2-cw*2,oy=50;
  const conn=[['0,0','1,0'],['1,0','2,0'],['1,0','1,1'],['2,0','3,0'],['3,0','3,-1'],['3,-1','2,-1']];
  dctx.strokeStyle='#6f68b8';dctx.lineWidth=2;
  for(const [a,b] of conn){if(!G.visited[a]||!G.visited[b])continue;const [ax,ay]=a.split(',').map(Number),[bx,by]=b.split(',').map(Number);dctx.beginPath();dctx.moveTo(ox+ax*cw+cw/2,oy+(ay+1)*ch+ch/2);dctx.lineTo(ox+bx*cw+cw/2,oy+(by+1)*ch+ch/2);dctx.stroke();}
  for(const k in ROOMS){if(!G.visited[k])continue;const [rx,ry]=k.split(',').map(Number),x=ox+rx*cw+4,y=oy+(ry+1)*ch+4,w=cw-8,h=ch-8,c=k===curKey;
    dctx.fillStyle=c?'#5a4aa8':'#2a3a7a';dctx.fillRect(x,y,w,h);dctx.strokeStyle=c&&blink?'#ffd27a':'#9fb4ff';dctx.lineWidth=1;dctx.strokeRect(x+0.5,y+0.5,w-1,h-1);
    wrap(ROOMS[k].name,w-6,7).forEach((l,i)=>txt(l,x+w/2,y+8+i*9,7,'#ffffff','center'));
    let left=0;for(const r of ROOMS[k].map)for(let i=0;i<r.length;i++)if(r[i]==='c'){left++;}

  const icons=[['dash','Investida'],['double','Asas do Vento'],['burst','Explosão de Luz']];
  icons.forEach(([a,n],i)=>{const x=60+i*130,y=H-40,on=G.ab[a];dctx.globalAlpha=on?1:0.35;drawIcon(dctx,ABIL[a].icon,x,y+4,1,on?ABIL[a].col:'#777');txt(on?n:'???',x+12,y,8,on?'#ffffff':'#888');dctx.globalAlpha=1;});

}

// ---------- início ----------
newGame();hasSave=!!loadSave();loadRoom('0,0');setTitlePlayer();banner.t=0;
let last=performance.now(),acc=0;const STEP=1000/60;
let testHold=false;
function frame(now){acc+=Math.min(100,now-last);last=now;while(acc>=STEP){if(!testHold){update();for(const k in pressed)delete pressed[k];}acc-=STEP;}render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
// gancho de teste (depuração)
window.__nc={get P(){return P;},get G(){return G;},get mode(){return mode;},set mode(v){mode=v;},get boss(){return boss;},get room(){return curKey;},loadRoom,ROOMS,render,
  snapshot(w,h){const s=[cv.width,cv.height,SC,OX,OY];cv.width=w;cv.height=h;SC=Math.min(w/W,h/H);OX=Math.floor((w-W*SC)/2);OY=Math.floor((h-H*SC)/2);render();const u=cv.toDataURL('image/png');[cv.width,cv.height,SC,OX,OY]=s;render();return u;},
  set popup(v){popup=v;},set banner(v){banner=v;},set toast(v){toast=v;},get parts(){return parts;},
  hold(v){testHold=v;for(const k in keys)keys[k]=false;},
  step(n,held=[],tap=[]){for(let i=0;i<n;i++){if(held===null){update();for(const k in pressed)delete pressed[k];continue;}for(const k in keys)keys[k]=false;held.forEach(c=>keys[c]=true);if(i===0)tap.forEach(c=>{pressed[c]=true;keys[c]=true;});update();for(const k in pressed)delete pressed[k];}}};
